<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Login</title>
  <link rel="stylesheet" href="styles/login.css">
</head>
<body>
  <!-- Background video -->
  <video autoplay muted loop id="bg-video">
    <source src="assets/background.mp4" type="video/mp4">
    Your browser does not support HTML5 video.
  </video>
  <!-- Centered login container -->
  <div class="parent">
    <div class="login-window">
      <!-- Login Form -->
      <form class="login-form" id="loginForm">
        <h2>Login</h2>
        <label for="wallet">Wallet Address or Username:</label>
        <input type="text" id="wallet" name="wallet" placeholder="0x... or username" required>
        <label for="password">Password:</label>
        <input type="password" id="password" name="password" required>
        <button type="submit">Login</button>  
        <button type="button" id="showCreateForm">Create Account</button>
      </form>

      <!-- Create Account Form (Initially Hidden) -->
      <form class="create-form" id="createForm" style="display: none;">
        <h2>Create Account</h2>
        <label for="createEmail">Email Address:</label>
        <input type="email" id="createEmail" name="createEmail" placeholder="your.email@example.com" required>
        
        <label for="createWallet">Wallet Address:</label>
        <input type="text" id="createWallet" name="createWallet" placeholder="0x..." required>
        
        <label for="createPassword">Password:</label>
        <input type="password" id="createPassword" name="createPassword" required>
        
        <label for="createName">Full Name (Optional):</label>
        <input type="text" id="createName" name="createName" placeholder="John Doe">
        
        <button type="submit">Create Account</button>
        <button type="button" id="showLoginForm">Back to Login</button>
      </form>

      <div class="login-logo">
        <img src="assets/login-logo.png" alt="login logo of insure kaba">
      </div>
    </div>
  </div>

  <script>
    const API_BASE = "http://localhost:3000";

    // Form switching
    document.getElementById("showCreateForm").addEventListener("click", function() {
      document.getElementById("loginForm").style.display = "none";
      document.getElementById("createForm").style.display = "block";
    });

    document.getElementById("showLoginForm").addEventListener("click", function() {
      document.getElementById("createForm").style.display = "none";
      document.getElementById("loginForm").style.display = "block";
    });

    // ===== LOGIN HANDLER =====
    document.getElementById("loginForm").addEventListener("submit", async function (e) {
      e.preventDefault();
      const walletOrUsername = document.getElementById("wallet").value.trim();
      const password = document.getElementById("password").value.trim();
      
      if (!walletOrUsername || !password) {
        alert("Please enter wallet address/username and password");
        return;
      }
      
      try {
        // Send both fields - backend will handle the logic
        const response = await fetch(`${API_BASE}/login`, {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({
            walletAddress: walletOrUsername.startsWith('0x') ? walletOrUsername : null,
            username: !walletOrUsername.startsWith('0x') ? walletOrUsername : null,
            password: password
          })
        });
        
        const data = await response.json();
        
        if (!response.ok) {
          alert(data.error || "Login failed");
          return;
        }
        
        // Save session info
        localStorage.setItem("userId", data.userId);
        localStorage.setItem("walletAddress", data.walletAddress);
        localStorage.setItem("role", data.role);
        localStorage.setItem("username", data.username);
        localStorage.setItem("tokenBalance", data.token_balance || 0);
        
        // Redirect by role
        switch (data.role) {
          case "admin-philhealth":
            window.location.href = "pages/admin.html";
            break;
          case "admin-hospital":
            window.location.href = "pages/hospital.html";
            break;
          case "user":
            window.location.href = "pages/guest.html";
            break;
          default:
            alert("Unknown role: " + data.role);
        }
      } catch (err) {
        console.error("Login error:", err);
        alert("Server error. Please try again later.");
      }
    });

    // ===== CREATE ACCOUNT HANDLER =====
    document.getElementById("createForm").addEventListener("submit", async function (e) {
      e.preventDefault();
      
      const email = document.getElementById("createEmail").value.trim();
      const walletAddress = document.getElementById("createWallet").value.trim();
      const password = document.getElementById("createPassword").value.trim();
      const name = document.getElementById("createName").value.trim();
      
      if (!email || !walletAddress || !password) {
        alert("Please fill in all required fields");
        return;
      }
      
      // Validate email format
      const emailRegex = /^[^\s@]+@[^\s@]+\.[^\s@]+$/;
      if (!emailRegex.test(email)) {
        alert("Please enter a valid email address");
        return;
      }
      
      // Validate wallet address format
      if (!walletAddress.startsWith('0x') || walletAddress.length !== 42) {
        alert("Please enter a valid Ethereum wallet address (42 characters starting with 0x)");
        return;
      }
      
      // Validate password strength
      if (password.length < 6) {
        alert("Password must be at least 6 characters long");
        return;
      }
      
      try {
        const response = await fetch(`${API_BASE}/create-user`, {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({
            email: email,
            walletAddress: walletAddress,
            password: password,
            role: "user",
            name: name || null
          })
        });
        
        const data = await response.json();
        
        if (!response.ok) {
          alert(data.error || "Account creation failed");
          return;
        }
        
        alert(`Account created successfully!\nUsername: ${data.username}\nYou can now log in with your wallet address or username.`);
        
        // Switch back to login form and clear create form
        document.getElementById("createForm").style.display = "none";
        document.getElementById("loginForm").style.display = "block";
        document.getElementById("createForm").reset();
        
      } catch (err) {
        console.error("Create account error:", err);
        alert("Server error. Please try again later.");
      }
    });
  </script>
</body>
</html>
