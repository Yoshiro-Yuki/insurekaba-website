<!DOCTYPE html>
<html lang="en">
<head>
  
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Medical Records & Claims</title>
  <link rel="stylesheet" href="../styles/check.css">
</head>
<body>
  <h1>Medical Records & Claims</h1>

  <!-- File Upload Form -->
  <form id="uploadForm">
    <h2>Upload Medical Record</h2>
    <input type="file" name="recordfile" required class="input-file">
    <button type="submit">Upload</button>
    <p id="uploadResult"></p>
  </form>

  <!-- Claim Submission Form -->
  <form id="claimForm">
    <h2>Submit Claim</h2>
    <textarea name="details" placeholder="Claim details" required></textarea>
    <select name="attachedFileHashes" id="attachedFileHashes" multiple size="5">
      <option value="">Select files to attach (hold Ctrl/Cmd for multiple)</option>
    </select>
    <button type="submit">Submit Claim</button>
    <p id="claimResult"></p>
  </form>
  <!-- Display all records -->
  <h2>All Uploaded Records</h2>
  <ul id="recordsList"></ul>
  <!-- Display all claims -->
  <h2>All Claims</h2>
  <ul id="claimsList"></ul>
  <!-- Link to separate JS file -->
  <script src="../scripts/check.js"></script>
</body>
</html>
